# "localhost" here means "the machine running `ansible-playbook`" - a CI
# runner, a bastion host, or an engineer's laptop with awscli/kubectl
# configured against the target EKS cluster. This project's Ansible
# playbooks are almost entirely Kubernetes-API-driven (via
# kubernetes.core.helm / kubernetes.core.k8s), NOT SSH-driven - there are
# no application servers to SSH into, since everything runs as pods on
# EKS. See docs/13-ansible.md for when Ansible earns its place here at all
# given that fact.
[local]
localhost ansible_connection=local

# A real multi-account setup would add a `bastion` group here (dynamic
# aws_ec2 inventory plugin, filtered by an EC2 tag) for the rare cases
# that DO need SSH - e.g. an emergency break-glass box with private
# access to RDS for a manual query. Not needed for this project's normal
# operation.
