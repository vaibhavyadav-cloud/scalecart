# DestinationRule = client-side circuit breaking. outlierDetection is what
# implements the "circuit breaker" pattern at the mesh level: if a pod
# starts erroring, Envoy stops sending it traffic for a cooldown window
# instead of every caller retrying against a pod that's already unhealthy
# and making things worse. connectionPool caps how much load any one
# caller can put on a single pod, which is what actually protects a
# struggling service from being overwhelmed by its callers' retries.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: auth-service
  namespace: scalecart-prod
spec:
  host: auth-service
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp: { maxConnections: 100 }
      http: { http1MaxPendingRequests: 50, maxRequestsPerConnection: 10 }
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: product-service
  namespace: scalecart-prod
spec:
  host: product-service
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp: { maxConnections: 200 }   # highest ceiling - product-service takes the most concurrent read traffic
      http: { http1MaxPendingRequests: 100, maxRequestsPerConnection: 20 }
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: cart-service
  namespace: scalecart-prod
spec:
  host: cart-service
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp: { maxConnections: 150 }
      http: { http1MaxPendingRequests: 75 }
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: order-service
  namespace: scalecart-prod
spec:
  host: order-service
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp: { maxConnections: 80 }
      http: { http1MaxPendingRequests: 40, maxRequestsPerConnection: 5 }
    outlierDetection:
      # Stricter than the read-path services - order-service failures are
      # expensive (revenue-impacting), so eject a misbehaving pod faster.
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 60s
      maxEjectionPercent: 33
  subsets:
    - name: v1
      labels: { version: v1 }
    - name: v2
      labels: { version: v2 }
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: payment-service
  namespace: scalecart-prod
spec:
  host: payment-service
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp: { maxConnections: 80 }
      http: { http1MaxPendingRequests: 40 }
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 60s
      maxEjectionPercent: 33
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend
  namespace: scalecart-prod
spec:
  host: frontend
  trafficPolicy:
    tls: { mode: ISTIO_MUTUAL }
    connectionPool:
      tcp: { maxConnections: 200 }
