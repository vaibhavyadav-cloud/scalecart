apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart-service
  namespace: scalecart-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-service-config
  namespace: scalecart-prod
data:
  PORT: "4003"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: scalecart-prod
  labels: { app: cart-service, tier: backend }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: cart-service }
  template:
    metadata:
      labels: { app: cart-service, tier: backend }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "4003" }
    spec:
      serviceAccountName: cart-service
      priorityClassName: scalecart-standard
      terminationGracePeriodSeconds: 15   # short - cart requests are fast, no long-lived work to drain
      containers:
        - name: cart-service
          image: ghcr.io/scalecart/cart-service:latest
          ports: [{ containerPort: 4003 }]
          envFrom:
            - configMapRef: { name: cart-service-config }
            - secretRef: { name: cart-service-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 400m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health/live, port: 4003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 4003 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: scalecart-prod
spec:
  selector: { app: cart-service }
  ports: [{ port: 4003, targetPort: 4003, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart-service
  namespace: scalecart-prod
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cart-service }
  minReplicas: 3
  maxReplicas: 25
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cart-service
  namespace: scalecart-prod
spec:
  minAvailable: 2
  selector: { matchLabels: { app: cart-service } }
