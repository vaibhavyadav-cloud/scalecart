apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: scalecart-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: scalecart-prod
data:
  PORT: "4005"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-bootstrap.kafka.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: scalecart-prod
  labels: { app: payment-service, tier: backend }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service, tier: backend, scalecart.io/kafka-client: "true" }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "4005" }
    spec:
      serviceAccountName: payment-service
      priorityClassName: scalecart-critical
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: payment-service } }
      initContainers:
        - name: db-migrate
          image: ghcr.io/scalecart/payment-service:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef: { name: payment-service-secrets }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: payment-service
          image: ghcr.io/scalecart/payment-service:latest
          ports: [{ containerPort: 4005 }]
          envFrom:
            - configMapRef: { name: payment-service-config }
            - secretRef: { name: payment-service-secrets }
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
          livenessProbe:
            httpGet: { path: /health/live, port: 4005 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 4005 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: scalecart-prod
spec:
  selector: { app: payment-service }
  ports: [{ port: 4005, targetPort: 4005, name: http }]
---
# No CPU-based HPA here - see k8s/keda/payment-consumer-scaledobject.yaml.
# payment-service's real bottleneck is Kafka consumer lag on order.created,
# not CPU (the gateway call it makes is I/O-bound, not compute-bound), so
# KEDA scales it on lag instead of a plain HPA on CPU utilization.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service
  namespace: scalecart-prod
spec:
  minAvailable: 2
  selector: { matchLabels: { app: payment-service } }
