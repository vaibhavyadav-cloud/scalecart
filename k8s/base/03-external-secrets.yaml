# External Secrets Operator (installed by ansible/playbooks/01-install-cluster-addons.yml)
# syncs real secret VALUES from AWS Secrets Manager into native k8s
# Secret objects on a refresh interval. The Deployment manifests only ever
# reference the resulting k8s Secret by name - nobody hand-creates or
# commits a k8s Secret with real credentials in it, and the values never
# pass through git or a CI log. See docs/15-security-hardening.md.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: scalecart-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa   # IRSA-annotated ServiceAccount, see terraform/modules/iam
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-secrets
  namespace: scalecart-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: auth-service-secrets   # k8s Secret created/kept in sync by ESO
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: scalecart/prod/auth-service, property: database_url }
    - secretKey: JWT_SECRET
      remoteRef: { key: scalecart/prod/auth-service, property: jwt_secret }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-service-secrets
  namespace: scalecart-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: payment-service-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: scalecart/prod/payment-service, property: database_url }
