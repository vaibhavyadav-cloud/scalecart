# ResourceQuota caps the TOTAL resources a namespace can consume - it's
# what stops one team's runaway HPA (e.g. product-service scaling to 200
# pods during a traffic spike) from starving every other service in the
# same cluster of schedulable capacity. LimitRange fills in a default
# request/limit for any container that forgets to set one, so a missing
# resources block fails safe instead of defaulting to "unbounded."
apiVersion: v1
kind: ResourceQuota
metadata:
  name: scalecart-quota
  namespace: scalecart-prod
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.cpu: "80"
    limits.memory: 160Gi
    pods: "300"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: scalecart-default-limits
  namespace: scalecart-prod
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
