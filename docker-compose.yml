version: "3.9"

# Local dev stack: the entire ScaleCart platform runnable with one command,
# no AWS account or Kubernetes cluster required. This intentionally mirrors
# the production topology (same services, same two DB families, same
# Kafka topics) so behavior you see here matches what you'll see in k8s -
# see docs/17-local-quickstart.md.

x-node-service-defaults: &node-defaults
  restart: unless-stopped
  networks: [scalecart]

services:
  # ---------- Data stores ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scalecart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalecart_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalecart}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [scalecart]

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-scalecart}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-scalecart_dev_password}
    volumes: [mongodata:/data/db]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [scalecart]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [scalecart]

  # ---------- Kafka (KRaft mode - no ZooKeeper) ----------
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "ScaleCartLocalDevCluster1"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [scalecart]

  # Web UI for inspecting topics/consumer groups/lag while developing -
  # the same lag metric this exposes is what KEDA scales on in k8s
  # (see k8s/keda/payment-consumer-scaledobject.yaml).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8090:8080"]
    depends_on: [kafka]
    networks: [scalecart]

  # ---------- Application services ----------
  auth-service:
    <<: *node-defaults
    build: ./services/auth-service
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-scalecart}:${POSTGRES_PASSWORD:-scalecart_dev_password}@postgres:5432/scalecart_auth
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports: ["4001:4001"]
    depends_on:
      postgres: { condition: service_healthy }
    # `prisma db push` syncs the schema without needing a checked-in
    # migrations/ history - fine for this local-dev/demo setup. A real
    # team would run `prisma migrate dev` once to generate versioned SQL
    # migration files and commit them, then use `prisma migrate deploy`
    # here and in the CI/CD pipeline instead. See docs/03-databases-per-service.md.
    command: sh -c "npx prisma db push --skip-generate && node dist/index.js"

  product-service:
    restart: unless-stopped
    networks: [scalecart]
    build: ./services/product-service
    environment:
      PORT: 4002
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-scalecart}:${MONGO_INITDB_ROOT_PASSWORD:-scalecart_dev_password}@mongo:27017
      MONGO_DB: scalecart_products
    ports: ["4002:4002"]
    depends_on:
      mongo: { condition: service_healthy }

  cart-service:
    restart: unless-stopped
    networks: [scalecart]
    build: ./services/cart-service
    environment:
      PORT: 4003
      REDIS_URL: redis://redis:6379/0
    ports: ["4003:4003"]
    depends_on:
      redis: { condition: service_healthy }

  order-service:
    restart: unless-stopped
    networks: [scalecart]
    build: ./services/order-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: scalecart_orders
      DB_USER: ${POSTGRES_USER:-scalecart}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-scalecart_dev_password}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    ports: ["4004:4004"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  payment-service:
    <<: *node-defaults
    build: ./services/payment-service
    environment:
      PORT: 4005
      DATABASE_URL: postgresql://${POSTGRES_USER:-scalecart}:${POSTGRES_PASSWORD:-scalecart_dev_password}@postgres:5432/scalecart_payments
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    ports: ["4005:4005"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    # `prisma db push` syncs the schema without needing a checked-in
    # migrations/ history - fine for this local-dev/demo setup. A real
    # team would run `prisma migrate dev` once to generate versioned SQL
    # migration files and commit them, then use `prisma migrate deploy`
    # here and in the CI/CD pipeline instead. See docs/03-databases-per-service.md.
    command: sh -c "npx prisma db push --skip-generate && node dist/index.js"

  notification-service:
    restart: unless-stopped
    networks: [scalecart]
    build: ./services/notification-service
    environment:
      PORT: 4006
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    ports: ["4006:4006"]
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  frontend:
    restart: unless-stopped
    networks: [scalecart]
    build: ./services/frontend
    ports: ["3000:8080"]
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
      - payment-service

networks:
  scalecart:
    driver: bridge

volumes:
  pgdata:
  mongodata:
