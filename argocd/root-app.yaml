# The "app of apps" root: this is the ONE Application a human (or the
# bootstrap Ansible playbook) applies manually with `kubectl apply -f`.
# Everything else - the AppProject, the per-environment Applications
# generated by the ApplicationSet below - is then managed BY ArgoCD
# itself, because this Application's source is the argocd/ directory of
# this same repo. From this point on, "add a new environment" or "change
# a sync policy" is a git commit, not a kubectl command. See
# docs/10-argocd-gitops.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scalecart-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: scalecart
  source:
    repoURL: "https://github.com/scalecart/scalecart.git"
    targetRevision: main
    path: argocd/apps
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true    # revert manual `kubectl edit` drift back to what git says
    syncOptions:
      - CreateNamespace=false
