namespace: scalecart-prod
tier: backend
port: 4006
metricsPath: /metrics

image:
  repository: ghcr.io/scalecart/notification-service
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2
priorityClassName: scalecart-best-effort
terminationGracePeriodSeconds: 20
topologySpread: false
writableTmp: false
kafkaClient: true
hasSecrets: true

initContainer:
  enabled: false

startupProbe:
  enabled: false
livenessProbe:
  path: /health/live
readinessProbe:
  path: /health/ready

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 300m, memory: 256Mi }

autoscaling:
  enabled: false   # scaled by KEDA on Kafka lag instead
  minReplicas: 1
  maxReplicas: 10

pdb:
  minAvailable: 1

serviceAccount:
  irsaRoleArn: ""

env:
  PORT: "4006"
  KAFKA_BOOTSTRAP_SERVERS: kafka-bootstrap.kafka.svc.cluster.local:9092
