server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style fallback for Next.js static export routes.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # The frontend's own nginx proxies /api/* to each backend service by
    # its short DNS name - this is what NEXT_PUBLIC_API_BASE_URL=/api
    # (the default, see src/lib/api.ts) actually calls, and it's
    # deliberately identical in docker-compose AND in Kubernetes: a
    # Service named "auth-service" resolves via plain DNS in both a
    # Compose bridge network and a same-namespace k8s cluster, so this
    # config and the built frontend image never change between the two
    # environments. k8s/istio/02-virtual-service.yaml's path-based routes
    # to these same services exist for a DIFFERENT purpose - direct API
    # access for non-browser clients through the mesh ingress gateway,
    # not for the frontend, which always talks through this proxy.
    # This also keeps the browser same-origin (no CORS) in both setups.
    location /api/auth/ {
        proxy_pass http://auth-service:4001/auth/;
    }
    location /api/products {
        proxy_pass http://product-service:4002/products;
    }
    location /api/cart/ {
        proxy_pass http://cart-service:4003/cart/;
    }
    location /api/orders {
        proxy_pass http://order-service:4004/orders;
    }
    location /api/payments/ {
        proxy_pass http://payment-service:4005/payments/;
    }

    location /healthz {
        access_log off;
        return 200 "ok";
    }
}
