server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style fallback for Next.js static export routes.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # In docker-compose local dev, the frontend container proxies /api/*
    # to the individual services so NEXT_PUBLIC_API_BASE_URL=/api works
    # without CORS. In k8s this role is played by the Istio Gateway
    # instead (see k8s/istio/gateway.yaml) - the frontend code itself
    # doesn't change between the two.
    location /api/auth/ {
        proxy_pass http://auth-service:4001/auth/;
    }
    location /api/products {
        proxy_pass http://product-service:4002/products;
    }
    location /api/cart/ {
        proxy_pass http://cart-service:4003/cart/;
    }
    location /api/orders {
        proxy_pass http://order-service:4004/orders;
    }
    location /api/payments/ {
        proxy_pass http://payment-service:4005/payments/;
    }

    location /healthz {
        access_log off;
        return 200 "ok";
    }
}
